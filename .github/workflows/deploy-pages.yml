name: Verify and Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      # Recreate ignored synthetic holdout files only inside the ephemeral runner.
      # They are required by dataset-isolation tests but remain unpublished and
      # are never sent to a model.
      - run: python -m eval.ai_qa_datasets
      - run: python -m unittest discover -s tests
      - run: python -m eval.run_eval
      - run: python -m scripts.check_eval_numbers
      - run: git diff --check
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
